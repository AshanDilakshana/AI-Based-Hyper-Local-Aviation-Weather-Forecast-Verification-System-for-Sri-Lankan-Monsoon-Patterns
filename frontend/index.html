<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Weather - Second Inter-Monsoon</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004494; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 4px; text-align: center; font-weight: bold; display: none; }
        .safe { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .warning { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Stability Prediction Model</h2>
    <p style="text-align:center; font-size:14px; color:#666;">Second Inter-Monsoon (RH & QNH)</p>
    
    <form id="predictionForm">
        <label for="relative_humidity">Current Relative Humidity (%):</label>
        <input type="number" id="relative_humidity" step="0.1" required>

        <label for="qnh_pressure">Current QNH Pressure (hPa):</label>
        <input type="number" id="qnh_pressure" step="0.1" required>
        
        <label for="qnh_drop_3h">QNH Change (Last 3h):</label>
        <input type="number" id="qnh_drop_3h" step="0.1" required>

        <label for="rh_change_3h">RH Change (Last 3h):</label>
        <input type="number" id="rh_change_3h" step="0.1" required>
        
        <label for="rh_qnh_interaction">RH/QNH Ratio:</label>
        <input type="number" id="rh_qnh_interaction" step="0.001" required>

        <button type="submit">Generate Prediction</button>
    </form>

    <div id="resultBox" class="result-box">
        <p>Predicted QNH Change: <span id="predValue"></span> hPa</p>
        <p>Status: <span id="statusValue"></span></p>
    </div>
</div>

<script>
    document.getElementById('predictionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Gather data from the form
        const inputData = {
            relative_humidity: parseFloat(document.getElementById('relative_humidity').value),
            qnh_pressure: parseFloat(document.getElementById('qnh_pressure').value),
            qnh_drop_3h: parseFloat(document.getElementById('qnh_drop_3h').value),
            rh_change_3h: parseFloat(document.getElementById('rh_change_3h').value),
            rh_qnh_interaction: parseFloat(document.getElementById('rh_qnh_interaction').value)
            // Note: Add 'qnh_rolling_mean_6h' and 'rh_rolling_mean_6h' if your final model expects them.
        };

        try {
            // Send request to Flask backend
            const response = await fetch('http://127.0.0.1:5000/api/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(inputData)
            });

            const result = await response.json();

            // Display results
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            document.getElementById('predValue').innerText = result.predicted_qnh_change;
            document.getElementById('statusValue').innerText = result.stability_status;

            if (result.stability_status.includes("Warning")) {
                resultBox.className = 'result-box warning';
            } else {
                resultBox.className = 'result-box safe';
            }
        } catch (error) {
            console.error('Error:', error);
            alert("Failed to connect to the prediction server. Ensure Flask backend is running.");
        }
    });
</script>

</body>
</html>
